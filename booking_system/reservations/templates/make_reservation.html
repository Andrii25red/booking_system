<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Забронювати кімнату — Система Бронювання</title>
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0069d9;
      --bg-light: #f8f9fa;
      --bg-white: #ffffff;
      --text-dark: #343a40;
      --border: #ced4da;
      --radius: 6px;
      --spacing: 1rem;
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Open Sans', sans-serif;
      background: var(--bg-light);
      color: var(--text-dark);
      line-height: 1.5;
    }
    .wrapper {
      max-width: 500px;
      margin: calc(var(--spacing) * 2) auto;
      padding: var(--spacing);
      background: var(--bg-white);
      border-radius: var(--radius);
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    h1 {
      margin: 0 0 var(--spacing);
      font-size: 1.75rem;
      font-weight: 600;
      color: var(--primary);
      text-align: center;
    }
    .booking-form {
      display: flex;
      flex-direction: column;
    }
    .booking-form p {
      margin-bottom: var(--spacing);
    }
    .booking-form label {
      display: block;
      margin-bottom: 0.25rem;
      font-weight: 600;
    }
    .booking-form input,
    .booking-form select {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 1rem;
    }
    .booking-form input:focus,
    .booking-form select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 4px rgba(0,105,217,0.3);
    }
    .btn {
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: var(--primary);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.2s;
      margin-top: var(--spacing);
    }
    .btn:hover {
      background: darken(var(--primary), 10%);
    }
    .back-link {
      display: block;
      margin-top: calc(var(--spacing) * 1.5);
      text-decoration: none;
      color: var(--primary);
      font-size: 0.95rem;
      text-align: center;
      font-weight: 600;
    }
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>Забронювати кімнату</h1>
    <form method="post" class="booking-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn">Забронювати</button>
    </form>
    <a href="{% url 'rooms:room_list' %}" class="back-link">← Повернутися до списку кімнат</a>
  </div>
</body>
</html>
