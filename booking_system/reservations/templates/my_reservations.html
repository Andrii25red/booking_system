<h2>Мої бронювання</h2>
<table border="1">
    <tr>
        <th>Кімната</th>
        <th>Період</th>
        <th>Статус</th>
    </tr>
    {% for res in reservations %}
        <tr>
            <td>{{ res.room.name }}</td>
            <td>{{ res.start_date }} — {{ res.end_date }}</td>
            <td>{{ res.get_status_display }}</td>
        </tr>
    {% empty %}
        <tr><td colspan="3">У вас ще немає бронювань.</td></tr>
    {% endfor %}
</table>
<a href="{% url 'home' %}">← На головну</a>
